<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            width: 300px;
        }

        h1 {
            color: #333;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #5148d8;
        }

        #message {
            color: #333;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome!</h1>
        <p>Enter your name below.</p>

        <input
            type="text"
            id="username"
            placeholder="Your name"
        >

        <br>

        <button onclick="greetUser()">Say Hello</button>

        <h3 id="message"></h3>
    </div>

    <script>
        function greetUser() {
            const name = document.getElementById("username").value.trim();
            const message = document.getElementById("message");

            if (name === "") {
                message.textContent = "Please enter your name!";
            } else {
                message.textContent = "Hello, " + name + "! 👋";
            }
        }
    </script>
</body>
</html>
